<div class="p-4">
  <!-- TITLE -->
  <div class="flex items-center gap-2">
    <div class="h-px w-full bg-black/25"></div>
    <h1 class="text-sm text-black/75">Portfolio</h1>
    <div class="h-px w-full bg-black/25"></div>
  </div>
  <div class="flex w-full items-center justify-center">
    <div
      class="my-4 grid w-fit grid-cols-3 items-center gap-4 md:grid-cols-5 lg:grid-cols-7 xl:w-[1200px]"
    >
      @for (item of portfolio(); track $index) {
        <div
          class="group relative flex items-center justify-center"
          (click)="onItemClick($index)"
          [class.active]="selectedIndex === $index"
          tabindex="0"
        >
          @if (!loadedImages.has($index)) {
            <div
              class="absolute inset-0 flex animate-pulse items-center justify-center bg-zinc-200 text-xs text-white"
            ></div>
          }

          <img
            [ngSrc]="item.src"
            height="172"
            width="172"
            class="transition-all duration-300 group-hover:opacity-50 md:group-hover:opacity-50"
            [class.opacity-50]="selectedIndex === $index"
            [alt]="item.artist"
            loading="lazy"
            decoding="async"
            (load)="onImageLoad($index)"
          />

          <div
            class="pointer-events-none absolute inset-0 flex items-center justify-center opacity-0 transition-opacity duration-300 group-hover:opacity-100 md:group-hover:opacity-100"
            [class.opacity-100]="selectedIndex === $index"
          >
            <div
              class="flex size-full flex-col justify-center bg-black/80 px-2 py-1 text-center"
            >
              <h1
                class="text-[10px] font-medium text-white md:text-[14px] xl:text-[16px]"
              >
                {{ item.artist }}
              </h1>
              <h2
                class="mt-1 text-[6px] font-medium text-zinc-200 md:text-[10px] xl:text-[12px]"
              >
                {{ item.songAlbum }}
              </h2>
              <h3
                class="mt-2 text-[8px] font-medium text-zinc-400 md:text-[12px] xl:text-[14px]"
              >
                {{ item.job }}
              </h3>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
  <!-- BACK TO TOP -->
  <div class="mt-7 mb-2 flex items-center justify-center gap-2">
    <div class="h-px w-full bg-black/25"></div>
    <button
      class="w-fit rounded px-2 py-1 text-xs whitespace-nowrap text-black/75 hover:outline hover:outline-black/25"
      (click)="scrollToTop()"
      aria-label="Volver al inicio"
    >
      <h1>Back to top ↑</h1>
    </button>
    <div class="hidden h-px w-full bg-black/25 md:block"></div>
  </div>
</div>
