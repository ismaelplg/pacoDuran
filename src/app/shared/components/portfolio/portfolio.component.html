<div class="flex flex-col mt-4">
  <div class="w-full flex items-center justify-center px-8 gap-2">
    <div class="h-px w-full bg-black"></div>
    <div class="text-sm">Portfolio</div>
    <div class="h-px w-full bg-black"></div>
  </div>

  <div class="grid grid-cols-3 md:grid-cols-5 lg:grid-cols-7 p-4 gap-4 mt-4 items-center">
    @for (item of portfolio(); track $index) {
      <div
        class="aspect-square flex items-center justify-center relative group"
        (click)="onItemClick($index)"
        [class.active]="selectedIndex === $index"
        tabindex="0"
      >
        <img
          [src]="item.src"
          class="transition-opacity duration-300 group-hover:opacity-50 md:group-hover:opacity-50"
          [class.opacity-50]="selectedIndex === $index"
          [alt]="`${item.artist} / ${item.album}`"
        />
        <div
          class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 md:group-hover:opacity-100 transition-opacity duration-300 pointer-events-none"
          [class.opacity-100]="selectedIndex === $index"
        >
          <span class="text-white text-sm font-medium bg-black bg-opacity-70 px-2 py-1 rounded">
            {{ item.artist }} / {{ item.album }}
          </span>
        </div>
      </div>
    }
  </div>
</div>
